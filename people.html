<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>People / MOSAIC Robotics Lab</title>
    <link rel="icon" type="image/svg+xml" href="assets/penrose.svg">
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <!-- Shared header and navigation are rendered by assets/site.js. -->
    <header class="site-header" data-site-header></header>
    <main id="main">
      <section class="page-title">
        <div class="section-inner">
          <p class="eyebrow">People</p>
        </div>
      </section>
      <section class="content-section">
        <div class="section-inner">
          <div class="person-grid">
            <article class="card person-card">
              <div class="person-photo">
                <img src="assets/edzc_headshot_square.jpg" alt="Dr. Elyse D. Z. Chase">
              </div>
              <div class="person-body">
                <h3>Dr. Elyse D. Z. Chase</h3>
                <p class="meta">Principal Investigator</p>
                <p>Elyse is an Assistant Professor of Mechanical & Aerospace Engineering and group leader of the MOSAIC Robotics Lab.</p>
                <div class="link-row profile-links person-profile-links" aria-label="Elyse Chase profile links">
                  <a class="icon-link" href="https://scholar.google.com/citations?hl=en&user=h-9pNEkAAAAJ&view_op=list_works&sortby=pubdate" aria-label="Google Scholar profile">
                    <img src="assets/scholar_icon.png" alt="">
                  </a>
                  <a class="icon-link" href="https://www.linkedin.com/in/elyse-dz-chase100/" aria-label="LinkedIn profile">
                    <img src="assets/linked_icon.png" alt="">
                  </a>
                </div>
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>
    <!-- Shared footer is rendered by assets/site.js. -->
    <footer class="site-footer" data-site-footer></footer>
    <script src="assets/site.js"></script>
  </body>
</html>
